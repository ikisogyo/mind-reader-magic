<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>こころみえみえ</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#000;color:#f4f5fb;font-family:system-ui,sans-serif}button,input{font:inherit}button{border:0;border-radius:14px;padding:12px 16px;background:#34384b;color:#fff;cursor:pointer}button.primary{background:#b52c48}button:disabled{opacity:.45}.screen{min-height:100dvh;padding:18px;display:none}.screen.active{display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.sub{color:#aeb3c6}.magic{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.heart{font-size:min(36vw,170px);line-height:1;filter:drop-shadow(0 0 20px #ad193b);user-select:none}.heart.ready{animation:pulse 1.4s infinite}.heart:active{transform:scale(.95)} .countDots{position:fixed;left:10px;bottom:10px;min-height:1.3em;display:flex;justify-content:flex-start;gap:.22em;font-size:1rem;letter-spacing:0;z-index:3}.countDots .dot{color:#888;display:inline-block}.countDots .dot.failed{color:#f33}.secretTapZone{position:fixed;left:0;right:0;bottom:0;height:140px;width:100%;z-index:2;touch-action:manipulation;pointer-events:auto;cursor:default}@keyframes pulse{50%{transform:scale(1.07)}}.hint{min-height:3em;color:#b8bdcc;margin:16px}.reveal{max-width:92vw;max-height:55vh;object-fit:contain;border-radius:18px}.revealText{font-size:1.5rem;font-weight:700;margin:12px}.settings{gap:14px}.field{background:#171b27;border:1px solid #30364a;border-radius:14px;padding:12px}.field label{display:block;color:#bbc2d3;font-size:.9rem;margin-bottom:6px}.field input[type=text]{width:100%;padding:10px;background:#0e1119;color:#fff;border:1px solid #40465a;border-radius:9px}.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{width:62px;height:62px;object-fit:cover;border-radius:9px;background:#252a38}.itemrow{display:flex;align-items:center;gap:8px}.danger{background:#7e2537}.footer{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.small{font-size:.82rem}
</style></head><body>
<section id="magic" class="screen"><div class="magic"><div id="heart" class="heart ready" role="button" aria-label="ハート">❤️</div><div id="dotCount" class="countDots" aria-label="読み込み件数"></div><div id="hint" class="hint" style="display:none"></div><div id="result" hidden></div></div><div id="secretTapZone" class="secretTapZone" aria-hidden="true"></div></section>
<section id="settings" class="screen settings active"><div class="top"><h2>事前設定</h2></div><div class="field"><button onclick="startPerformance()" class="primary" style="width:100%">保存してスタート</button></div><h3>特別写真</h3><div class="field"><label>特別写真画像</label><input type="file" accept="image/*" id="specialFile"><img id="specialPreview" class="preview" alt="特別写真プレビュー"><label>特別写真の判定用の言葉</label><input id="specialCue" type="text" placeholder="例：特別な写真"><label style="margin-top:10px">表示メッセージ</label><input id="specialMessage" type="text" placeholder="自由なメッセージ"></div><h3>判定用の言葉（6個）</h3><div id="cueFields"></div><div class="footer"><button onclick="saveSettings()" class="primary">保存</button><button onclick="resetItems()" class="danger">リセット（品物・画像のみ消去）</button></div><h3>端末の動作確認</h3><div class="field" id="networkStatus" role="status" aria-live="polite">通信状態を確認中…</div><div class="field"><button type="button" onclick="checkDiagnostics()">マイク・センサーなどを確認</button><p id="diagnostics" class="sub" aria-live="polite">ボタンを押すとマイク・通信・センサーを確認します。</p><p id="tiltStatus" class="sub" aria-live="polite">傾き：測定待ち</p></div><p id="settingsStatus" class="sub"></p></section>
<script src="bridge-events.js"></script><script>
const STORE='kokoromie_v148';let data={items:Array.from({length:6},()=>({name:'',image:''})),cues:['いきますよ','みえるかな','すごいこと','しずかにして','こころをうつします','むずかしいかな'],specialCue:'さいごにおもっていること',specialMessage:'大好き！',specialImage:''};let pending=null;let revealed=false;let listening=false;let secretTapCount=0;let secretTapTimer=null;let speechRetryTimer=null;
function storeImageFile(file,done){const rawFallback=()=>{const r=new FileReader();r.onload=()=>done(r.result);r.onerror=()=>done(null);r.readAsDataURL(file);};try{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);try{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx){rawFallback();return;}ctx.drawImage(img,0,0,w,h);const compressed=canvas.toDataURL('image/jpeg',0.82);if(compressed&&compressed.length<file.size*1.5)done(compressed);else rawFallback();}catch(e){rawFallback();}};img.onerror=()=>{URL.revokeObjectURL(url);rawFallback();};img.src=url;}catch(e){rawFallback();}}
function normalizeStoredData(v){const defaults={items:Array.from({length:6},()=>({name:'',image:''})),cues:['いきますよ','みえるかな','すごいこと','しずかにして','こころをうつします','むずかしいかな'],specialCue:'さいごにおもっていること',specialMessage:'大好き！',specialImage:''};if(!v||typeof v!=='object'||Array.isArray(v))return defaults;const items=Array.from({length:6},(_,i)=>{const item=Array.isArray(v.items)?v.items[i]:null;return {name:typeof item?.name==='string'?item.name:'',image:typeof item?.image==='string'?item.image:''};});const cues=Array.from({length:6},(_,i)=>Array.isArray(v.cues)&&typeof v.cues[i]==='string'?v.cues[i]:defaults.cues[i]);return {items,cues,specialCue:typeof v.specialCue==='string'?v.specialCue:defaults.specialCue,specialMessage:typeof v.specialMessage==='string'?v.specialMessage:defaults.specialMessage,specialImage:typeof v.specialImage==='string'?v.specialImage:''};}
function load(){try{const raw=localStorage.getItem(STORE);data=normalizeStoredData(JSON.parse(raw||'null'));}catch(e){data=normalizeStoredData(null);}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(data));return true;}catch(e){return false;}}
function commitImage(target,key,value){const previous=target[key];target[key]=value;if(save())return true;target[key]=previous;return false;}
function showMagic(){document.getElementById('settings').classList.remove('active');document.getElementById('magic').classList.add('active');}
function updateCountDots(){const dots=document.getElementById('dotCount');if(!dots)return;dots.innerHTML='';data.items.forEach((item,i)=>{if(!item||( !item.name&&!item.image))return;const span=document.createElement('span');span.className='dot'+(item.image?'':' failed');span.textContent='・';span.setAttribute('aria-label',(i+1)+'番 '+(item.image?'画像取得成功':'画像未取得'));dots.appendChild(span);});}
function handleSecretTap(){secretTapCount++;if(secretTapTimer)clearTimeout(secretTapTimer);if(secretTapCount>=5){secretTapCount=0;showSettings();return;}secretTapTimer=setTimeout(()=>{secretTapCount=0;secretTapTimer=null;},1800);}
function updateNetworkStatus(){const el=document.getElementById('networkStatus');if(!el)return;const online=!!navigator.onLine;el.textContent=online?'通信状態：オンライン（ネットワーク接続あり。画像取得先への接続までは保証しません）':'通信状態：オフライン（画像の取り込みや外部接続に失敗する可能性があります）';el.style.borderColor=online?'#2e7758':'#a24b54';}
window.addEventListener('online',updateNetworkStatus);window.addEventListener('offline',updateNetworkStatus);
function handleAndroidBack(){if(document.getElementById('settings').classList.contains('active')){stopListen();showMagic();return true;}return false;}
function showSettings(){stopListen();renderSettings();document.getElementById('magic').classList.remove('active');document.getElementById('settings').classList.add('active');updateNetworkStatus();startListen();}
function refreshCueThumbs(){data.cues.forEach((_,i)=>{const thumb=document.getElementById('cueThumb'+i);if(thumb)thumb.src=data.items[i]?.image||'';});}
function renderSettings(){const cues=document.getElementById('cueFields');cues.innerHTML='';data.cues.forEach((cue,i)=>{let div=document.createElement('div');div.className='field itemrow';div.innerHTML=`<img id="cueThumb${i}" class="preview" alt="登録画像"><div style="flex:1"><label>判定用の言葉 ${i+1}</label><input type="text" id="cue${i}" placeholder="判定用の言葉"></div>`;cues.appendChild(div);document.getElementById('cue'+i).value=cue||'';const thumb=document.getElementById('cueThumb'+i);thumb.src=data.items[i]?.image||'';});document.getElementById('specialCue').value=data.specialCue||'';document.getElementById('specialMessage').value=data.specialMessage||'';const sp=document.getElementById('specialPreview');sp.src=data.specialImage||'';const specialFile=document.getElementById('specialFile');specialFile.replaceWith(specialFile.cloneNode(true));const freshSpecialFile=document.getElementById('specialFile');freshSpecialFile.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;storeImageFile(f,result=>{if(!result){document.getElementById('settingsStatus').textContent='特別写真を読み込めませんでした。ファイルを変更して再試行してください。';return;}const saved=commitImage(data,'specialImage',result);sp.src=data.specialImage||'';document.getElementById('settingsStatus').textContent=saved?'特別写真を保存しました':'保存容量不足のため変更を取り消しました。画像を小さくするか、登録済み画像を減らしてください。';});});}
function saveSettings(){const previous=JSON.parse(JSON.stringify(data));data.cues=data.cues.map((_,i)=>document.getElementById('cue'+i).value.trim());data.specialCue=document.getElementById('specialCue').value.trim();data.specialMessage=document.getElementById('specialMessage').value.trim();const saved=save();if(!saved)data=previous;document.getElementById('settingsStatus').textContent=saved?'保存しました':'保存容量不足で保存できませんでした。変更を取り消しました。';return saved;}
function startPerformance(){if(!saveSettings())return;showMagic();startListen();}
function checkDiagnostics(){const out=document.getElementById('diagnostics');const rows=[];const bridge=!!window.MindMagicSpeech;rows.push((bridge?'OK':'NG')+'：Android音声ブリッジ '+(bridge?'接続済み':'未接続'));if(bridge){try{rows.push((MindMagicSpeech.available()?'OK':'NG')+'：音声認識サービス '+(MindMagicSpeech.available()?'利用可能':'利用不可'));rows.push((MindMagicSpeech.micPermissionGranted()?'OK':'要許可')+'：マイク権限 '+(MindMagicSpeech.micPermissionGranted()?'許可済み':'未許可'));}catch(e){rows.push('NG：Android診断情報の取得に失敗');}}const online=!!navigator.onLine;rows.push((online?'OK':'注意')+'：ネットワーク '+(online?'接続あり（外部サーバー疎通は未確認）':'オフライン'));try{const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=2;c.height=2;if(!ctx)throw new Error('canvas');ctx.fillRect(0,0,1,1);const dataUrl=c.toDataURL('image/jpeg');rows.push((dataUrl.startsWith('data:image/jpeg')?'OK':'NG')+'：画像圧縮機能 '+(dataUrl.startsWith('data:image/jpeg')?'利用可能':'確認失敗'));}catch(e){rows.push('NG：画像圧縮機能を利用できません');}const orientationSupported=('DeviceOrientationEvent' in window);rows.push((orientationSupported?'OK':'注意')+'：傾きセンサーAPI '+(orientationSupported?'対応（実センサー動作は未確認）':'非対応'));try{const key='__kokoromie_diag__';localStorage.setItem(key,'1');const ok=localStorage.getItem(key)==='1';localStorage.removeItem(key);rows.push((ok?'OK':'NG')+'：端末内保存 '+(ok?'利用可能':'確認失敗'));}catch(e){rows.push('NG：端末内保存を利用できません');}out.textContent=rows.join('\n');out.style.whiteSpace='pre-line';return rows;}
function resetItems(){stopListen();pending=null;revealed=false;const previous=data;data={...data,items:Array.from({length:6},()=>({name:'',image:''}))};const saved=save();if(!saved)data=previous;renderSettings();updateCountDots();document.getElementById('settingsStatus').textContent=saved?'品物と画像を消去しました。判定用の言葉・特別写真の設定は保持しています。':'保存失敗のため、品物と画像の消去を取り消しました。端末の保存容量を空けて再度リセットしてください。';document.getElementById('result').hidden=true;document.getElementById('result').innerHTML='';document.getElementById('heart').onclick=heartAction;
document.getElementById('heart').classList.add('ready');if(document.getElementById('magic').classList.contains('active'))document.getElementById('hint').textContent=saved?'品物と画像を消去しました。判定用の言葉は保持しています。':'リセットの保存に失敗しました。品物と画像は元の状態に戻しました。';}
function normalize(s){return String(s||'').trim().replace(/[\s。、！？]/g,'').toLowerCase()}
function isResetCue(text){const t=String(text||'').normalize('NFKC').toLowerCase().replace(/[\s、。,.・!?！？]/g,'');if(t==='リセット')return true;if(!t.startsWith('リセット'))return false;const suffix=t.slice('リセット'.length);return ['をしてください','をして','をお願いします','をお願い','してください','して下さい','して','お願いします','お願い','します','する'].some(s=>suffix===s); }
function cleanItemName(s){return String(s||'').normalize('NFKC').trim().replace(/[、,，。.!！?？\\s]+$/g,'').replace(/^(?:品物は|品物が|ここに|これらは|それは|あとは|あと)\s*/,'').replace(/(?:があります|がある|あります|が入っています|です|だよ|だ)$/,'').trim();}
function parseItemNames(text){let s=String(text||'').normalize('NFKC').trim();s=s.replace(/^(?:ここに|これらは|品物は|品物が|それは|あと|あとは)/,'').replace(/(?:があります|がある|あります|が入っています|です|だよ|だ)$/,'');return s.split(/[、,，・\\s]+|と/).map(cleanItemName).filter(x=>x&&!['スマホ','スマートフォン','画面','表示','表示します'].includes(x));}
async function retrieveItemImage(name,slot){const status=document.getElementById('settingsStatus');if(status)status.textContent=(slot+1)+'番の画像を検索中：'+name;try{const q=encodeURIComponent(name);const api='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch='+q+'&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url&iiurlwidth=700';const response=await fetch(api);if(!response.ok)throw new Error('HTTP '+response.status);const json=await response.json();const pages=Object.values(json.query?.pages||{});const candidates=pages.map(p=>p.imageinfo?.[0]?.thumburl||p.imageinfo?.[0]?.url).filter(Boolean);for(const url of candidates){const ok=await new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(true);img.onerror=()=>resolve(false);img.src=url;});if(!ok)continue;if(!data.items[slot]||normalize(data.items[slot].name)!==normalize(name))return;data.items[slot].image=url;if(!save()){data.items[slot].image='';continue;}const thumb=document.getElementById('cueThumb'+slot);if(thumb)thumb.src=url;updateCountDots();if(status)status.textContent=(slot+1)+'番「'+name+'」の画像を取得しました。';return;}if(status)status.textContent=(slot+1)+'番「'+name+'」の画像を読み込めませんでした（画像が見つかりません）。赤い点で表示します。';}catch(e){if(status)status.textContent=(slot+1)+'番「'+name+'」の画像を読み込めませんでした（画像取得に失敗）。赤い点で表示します。';}updateCountDots();}
function retrieveImagesForNewItems(){data.items.forEach((item,i)=>{if(item.name&&!item.image)retrieveItemImage(item.name,i);});}
function handleItemCommand(text){const s=String(text||'').normalize('NFKC').trim();
const addMatch=s.match(/^(.+?)(?:も|を)?追加(?:してね|してください|して下さい|お願いします|しておく|しておいてください|しておいて|して)?$/);
if(addMatch&&/追加/.test(s)){const before=data.items.map(it=>({...it}));const names=parseItemNames(addMatch[1]);let changed=0;for(const name of names){const slot=data.items.findIndex(it=>!it.name&&!it.image);if(slot<0)break;data.items[slot].name=name;changed++;}if(changed){if(!save()){data.items=before;return false;}updateCountDots();retrieveImagesForNewItems();return true;}return false;}
const change=s.match(/^(.+?)(?:を|から)(.+?)(?:に|へ)(?:変更|変えて|変換|して|してください|して下さい|お願いします)?$/);
if(change){const from=change[1].trim(),to=cleanItemName(change[2]);let idx=/^[1-6](?:番)?$/.test(from)?parseInt(from,10)-1:data.items.findIndex(it=>normalize(it.name)===normalize(from));if(idx>=0&&to){const before=data.items[idx].name;data.items[idx].name=to;if(save()){updateCountDots();return true;}data.items[idx].name=before;}return false;}
if(/(?:ここに|品物は|があります|がある)/.test(s)&&!/追加/.test(s)){const names=parseItemNames(s).slice(0,6);if(!names.length)return false;const before=data.items;data.items=Array.from({length:6},(_,i)=>({name:names[i]||'',image:''}));if(save()){updateCountDots();retrieveImagesForNewItems();return true;}data.items=before;}
return false;}
function onCue(text){let t=normalize(text);if(!t)return;if(isResetCue(text)){resetItems();return;}if(handleItemCommand(text))return;let idx=data.cues.findIndex((c,i)=>c&&normalize(c)&&t.includes(normalize(c))&&(data.items[i]?.name||data.items[i]?.image));if(idx>=0){stopListen();pending={kind:'item',index:idx,cueIndex:idx};prepareReveal();return;}if(data.specialCue&&normalize(data.specialCue)&&t.includes(normalize(data.specialCue))){stopListen();pending={kind:'special'};prepareReveal();}}
function prepareReveal(){revealed=false;document.getElementById('result').hidden=true;document.getElementById('result').innerHTML='';document.getElementById('heart').classList.add('ready');}
function playRevealSound(){/* ハート画面では演出音を鳴らさず静かに動作 */}
function reveal(){if(!pending||revealed)return;revealed=true;playRevealSound();stopListen();let result=document.getElementById('result');result.hidden=false;result.innerHTML='';document.getElementById('heart').classList.remove('ready');document.getElementById('hint').textContent='判定結果';if(pending.kind==='item'){let item=data.items[pending.index]||{};const cueLabel=data.cues[pending.cueIndex]||'';if(item.image){let img=document.createElement('img');img.className='reveal';img.src=item.image;img.alt=item.name||cueLabel||'選ばれた品物';result.appendChild(img);}let txt=document.createElement('div');txt.className='revealText';txt.textContent=item.name||cueLabel||'品物';result.appendChild(txt);}else{if(data.specialImage){let img=document.createElement('img');img.className='reveal';img.src=data.specialImage;img.alt='特別写真';result.appendChild(img);}let txt=document.createElement('div');txt.className='revealText';txt.textContent=data.specialMessage||'特別写真';result.appendChild(txt);}result.onclick=nextRound;document.getElementById('heart').onclick=nextRound;document.getElementById('hint').textContent='結果をタップすると次の心読みへ';}
function nextRound(){pending=null;revealed=false;document.getElementById('result').hidden=true;document.getElementById('result').innerHTML='';document.getElementById('heart').onclick=heartAction;document.getElementById('heart').classList.add('ready');startListen();}
function heartAction(){if(pending&&!revealed)reveal();}
function startListen(){if(window.MindMagicSpeech&&!listening){listening=true;window.MindMagicSpeech.start();}}
function stopListen(){if(speechRetryTimer){clearTimeout(speechRetryTimer);speechRetryTimer=null;}if(window.MindMagicSpeech)window.MindMagicSpeech.stop();listening=false;}
window.addEventListener('mindmagic-cue-text',e=>onCue(e.detail?.text));window.addEventListener('mindmagic-speech',e=>{let d=e.detail||{};if(d.type==='state'){listening=!!d.listening;return;}if(d.type==='error'){listening=false;if(!pending&&!revealed&&(d.code===6||d.code===7||d.code===8)){if(speechRetryTimer)clearTimeout(speechRetryTimer);speechRetryTimer=setTimeout(()=>{speechRetryTimer=null;if(!pending&&!revealed)startListen();},900);}return;}if(d.type==='result'){listening=false;if(!pending&&!revealed){onCue(d.text);if(!pending&&!revealed)startListen();}}});document.getElementById('heart').onclick=heartAction;document.getElementById('secretTapZone').addEventListener('click',handleSecretTap);
window.addEventListener('deviceorientation',e=>{const el=document.getElementById('tiltStatus');if(el&&typeof e.beta==='number'&&typeof e.gamma==='number')el.textContent='傾き：前後 '+Math.round(e.beta)+'° ／ 左右 '+Math.round(e.gamma)+'°';});
// Optional device tilt: face-down gesture (screen orientation Z-axis near 180 degrees).
window.addEventListener('deviceorientation',e=>{if(typeof e.beta!=='number')return;const faceDown=Math.abs(e.beta)>145,faceUp=Math.abs(e.beta)<35;if(pending&&!revealed&&faceDown){reveal();return;}if(revealed&&faceUp){nextRound();}});
load();renderSettings();updateCountDots();updateNetworkStatus();startListen();
</script></body></html>
