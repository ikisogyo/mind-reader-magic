const STORE='kokoromie_v148';let data={items:Array.from({length:6},()=>({name:'',image:''})),cues:['いきますよ','みえるかな','すごいこと','しずかにして','こころをうつします','むずかしいかな'],specialCue:'さいごにおもっていること',specialMessage:'大好き！',specialImage:''};let pending=null;let revealed=false;let specialOrientationActive=false;let specialFaceDownSeen=false;let listening=false;let secretTapCount=0;let secretTapTimer=null;let speechRetryTimer=null;let imageRequestTokens=Array.from({length:6},()=>0);let imageLoadingSlots=Array.from({length:6},()=>false);
function storeImageFile(file,done){const rawFallback=()=>{const r=new FileReader();r.onload=()=>done(r.result);r.onerror=()=>done(null);r.readAsDataURL(file);};try{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);try{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx){rawFallback();return;}ctx.drawImage(img,0,0,w,h);const compressed=canvas.toDataURL('image/jpeg',0.82);if(compressed&&compressed.length<file.size*1.5)done(compressed);else rawFallback();}catch(e){rawFallback();}};img.onerror=()=>{URL.revokeObjectURL(url);rawFallback();};img.src=url;}catch(e){rawFallback();}}
function normalizeStoredData(v){const defaults={items:Array.from({length:6},()=>({name:'',image:''})),cues:['いきますよ','みえるかな','すごいこと','しずかにして','こころをうつします','むずかしいかな'],specialCue:'さいごにおもっていること',specialMessage:'大好き！',specialImage:''};if(!v||typeof v!=='object'||Array.isArray(v))return defaults;const items=Array.from({length:6},(_,i)=>{const item=Array.isArray(v.items)?v.items[i]:null;return {name:typeof item?.name==='string'?item.name:'',image:typeof item?.image==='string'?item.image:''};});const cues=Array.from({length:6},(_,i)=>Array.isArray(v.cues)&&typeof v.cues[i]==='string'?v.cues[i]:defaults.cues[i]);return {items,cues,specialCue:typeof v.specialCue==='string'?v.specialCue:defaults.specialCue,specialMessage:typeof v.specialMessage==='string'?v.specialMessage:defaults.specialMessage,specialImage:typeof v.specialImage==='string'?v.specialImage:''};}
function load(){try{const raw=localStorage.getItem(STORE);data=normalizeStoredData(JSON.parse(raw||'null'));}catch(e){data=normalizeStoredData(null);}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(data));return true;}catch(e){return false;}}
function commitImage(target,key,value){const previous=target[key];target[key]=value;if(save())return true;target[key]=previous;return false;}
function showMagic(){document.getElementById('settings').classList.remove('active');document.getElementById('magic').classList.add('active');}
function clearItemSlot(i){if(i<0||i>=6||!data.items[i])return;const previous={...data.items[i]};imageRequestTokens[i]++;imageLoadingSlots[i]=false;data.items[i]={name:'',image:''};if(!save()){data.items[i]=previous;document.getElementById('settingsStatus').textContent='保存容量不足のため削除を取り消しました。';return;}updateCountDots();document.getElementById('settingsStatus').textContent=(i+1)+'番の品物と画像を消去しました。判定用の言葉は保持しています。'}
function renderItemSlots(){/* 品物管理は重複表示せず、判定語の横のサムネイルと登録名で状態を示す。 */data.items.forEach((item,i)=>{const label=document.getElementById('itemNameLabel'+i);if(label)label.textContent=item.name?'登録品：'+item.name:'品物未登録';});}
function updateCountDots(){const dots=document.getElementById('dotCount');if(!dots)return;dots.innerHTML='';data.items.forEach((item,i)=>{const registered=!!(item&&(item.name||item.image));const span=document.createElement('span');span.className='dot'+(registered?(item.image||imageLoadingSlots[i]?'':' failed'):' empty');span.textContent='・';if(registered)span.setAttribute('aria-label',(i+1)+'番 '+(item.image?'画像取得成功':imageLoadingSlots[i]?'画像取得中':'画像未取得'));dots.appendChild(span);});renderItemSlots();}
function handleSecretTap(){secretTapCount++;if(secretTapTimer){clearTimeout(secretTapTimer);secretTapTimer=null;}if(secretTapCount>=5){secretTapCount=0;showSettings();return;}secretTapTimer=setTimeout(()=>{secretTapCount=0;secretTapTimer=null;},1800);}

function refreshCueThumbs(){data.cues.forEach((_,i)=>{const thumb=document.getElementById('cueThumb'+i);if(thumb)thumb.src=data.items[i]?.image||'';});}
function renderSettings(){const cues=document.getElementById('cueFields');cues.innerHTML='';data.cues.forEach((cue,i)=>{let div=document.createElement('div');div.className='field itemrow';div.innerHTML=`<img id="cueThumb${i}" class="preview" alt="登録画像"><div id="itemNameLabel${i}" class="sub small" style="min-width:100%">品物未登録</div><div style="flex:1"><label>判定用の言葉 ${i+1}</label><input type="text" id="cue${i}" placeholder="判定用の言葉"><label>画像登録</label><input type="file" id="itemFile${i}" accept="image/*"></div>`;cues.appendChild(div);document.getElementById('cue'+i).value=cue||'';const thumb=document.getElementById('cueThumb'+i);thumb.src=data.items[i]?.image||'';const itemFile=document.getElementById('itemFile'+i);itemFile.addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;storeImageFile(file,result=>{if(!result){document.getElementById('settingsStatus').textContent=(i+1)+'番の画像を読み込めませんでした。';return;}const prev=data.items[i].image;data.items[i].image=result;if(!save()){data.items[i].image=prev;document.getElementById('settingsStatus').textContent='保存容量不足で画像登録を取り消しました。';return;}thumb.src=result;updateCountDots();document.getElementById('settingsStatus').textContent=(i+1)+'番の画像を登録しました。';});});});document.getElementById('specialCue').value=data.specialCue||'';document.getElementById('specialMessage').value=data.specialMessage||'';const sp=document.getElementById('specialPreview');sp.src=data.specialImage||'';const specialFile=document.getElementById('specialFile');specialFile.replaceWith(specialFile.cloneNode(true));const freshSpecialFile=document.getElementById('specialFile');freshSpecialFile.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;storeImageFile(f,result=>{if(!result){document.getElementById('settingsStatus').textContent='特別写真を読み込めませんでした。ファイルを変更して再試行してください。';return;}const saved=commitImage(data,'specialImage',result);sp.src=data.specialImage||'';document.getElementById('settingsStatus').textContent=saved?'特別写真を保存しました':'保存容量不足のため変更を取り消しました。画像を小さくするか、登録済み画像を減らしてください。';});});renderItemSlots();}
function saveSettings(){const previous=JSON.parse(JSON.stringify(data));data.cues=data.cues.map((_,i)=>document.getElementById('cue'+i).value.trim());data.specialCue=document.getElementById('specialCue').value.trim();data.specialMessage=document.getElementById('specialMessage').value.trim();const saved=save();if(!saved)data=previous;document.getElementById('settingsStatus').textContent=saved?'保存しました':'保存容量不足で保存できませんでした。変更を取り消しました。';return saved;}
function startPerformance(){if(!saveSettings())return;showMagic();startListen();}
function resetItems(){stopListen();pending=null;revealed=false;imageRequestTokens.forEach((token,i)=>{imageRequestTokens[i]++;imageLoadingSlots[i]=false;});const previous=data;data={...data,items:Array.from({length:6},()=>({name:'',image:''}))};const saved=save();if(!saved)data=previous;renderSettings();updateCountDots();document.getElementById('settingsStatus').textContent=saved?'品物と画像を消去しました。判定用の言葉・特別写真の設定は保持しています。':'保存失敗のため、品物と画像の消去を取り消しました。端末の保存容量を空けて再度リセットしてください。';document.getElementById('result').hidden=true;document.getElementById('result').innerHTML='';document.getElementById('heart').onclick=heartAction;
document.getElementById('heart').classList.add('ready');if(document.getElementById('magic').classList.contains('active'))document.getElementById('hint').textContent=saved?'品物と画像を消去しました。判定用の言葉は保持しています。':'リセットの保存に失敗しました。品物と画像は元の状態に戻しました。';startListen();}
function normalize(s){return String(s||'').normalize('NFKC').trim().replace(/[\s。、！？,.!?・]/g,'').toLowerCase().replace(/[\u30a1-\u30f6]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)).replace(/行きますよ/g,'いきますよ').replace(/行きます/g,'いきます').replace(/行く/g,'いく')}
function isResetCue(text){const t=String(text||'').normalize('NFKC').toLowerCase().replace(/[\s、。,.・!?！？]/g,'');if(t==='リセット')return true;if(!t.startsWith('リセット'))return false;const suffix=t.slice('リセット'.length);return ['をしてください','をして','をお願いします','をお願い','してください','して下さい','して','お願いします','お願い','します','する'].some(s=>suffix===s); }
function cleanItemName(s){return String(s||'').normalize('NFKC').trim().replace(/[、,，。.!！?？\s]+$/g,'').replace(/^(?:品物は|品物が|ここに|これらは|それは|あとは|あと)\s*/,'').replace(/(?:があります|がある|あります|が入っています|です|だよ|だ)$/,'').trim();}
function parseItemNames(text){let s=String(text||'').normalize('NFKC').trim();s=s.replace(/^(?:ここに|これらは|品物は|品物が|それは|あと|あとは)/,'').replace(/(?:があります|がある|あります|が入っています|です|だよ|だ)$/,'');return s.split(/[、,，・\s]+|(?:と|および|及び)/).map(cleanItemName).filter(x=>x&&!['スマホ','スマートフォン','画面','表示','表示します'].includes(x));}
async function retrieveItemImage(name,slot){if(slot<0||slot>=6||!name)return false;const token=++imageRequestTokens[slot];imageLoadingSlots[slot]=true;updateCountDots();const status=document.getElementById('settingsStatus');if(status)status.textContent=(slot+1)+'番「'+name+'」の画像を検索しています…';try{const queries=[name,name+' 画像',name+' filetype:bitmap'];let imageUrl='';for(const query of queries){const url='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch='+encodeURIComponent(query)+'&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url&iiurlwidth=1000';const response=await fetch(url);if(!response.ok)continue;const json=await response.json();const pages=Object.values(json.query?.pages||{});const page=pages.find(p=>p.imageinfo?.[0]?.thumburl);if(page){imageUrl=page.imageinfo[0].thumburl;break;}}if(!imageUrl)throw new Error('not-found');if(token!==imageRequestTokens[slot]||data.items[slot]?.name!==name)return false;const previous=data.items[slot].image;data.items[slot].image=imageUrl;if(!save()){data.items[slot].image=previous;throw new Error('storage');}imageLoadingSlots[slot]=false;refreshCueThumbs();updateCountDots();if(status)status.textContent=(slot+1)+'番「'+name+'」の画像を取り込みました。';return true;}catch(e){if(token===imageRequestTokens[slot]){imageLoadingSlots[slot]=false;updateCountDots();const status=document.getElementById('settingsStatus');if(status)status.textContent=(slot+1)+'番「'+name+'」の画像を取得できませんでした。品物名で表示します。';}return false;}}

function retrieveImagesForNewItems(){data.items.forEach((item,i)=>{if(item.name&&!item.image)retrieveItemImage(item.name,i);});}
function handleItemCommand(text){const s=String(text||'').normalize('NFKC').trim();
const addMatch=s.match(/^(.+?)(?:も|を)?追加(?:してください|して下さい|しました|します|してね|お願いします|しておいてください|しておいて|しておく|して)?$/);
if(addMatch&&/追加/.test(s)){const before=data.items.map(it=>({...it}));const names=parseItemNames(addMatch[1]);let changed=0,skipped=0;for(const name of names){if(data.items.some(it=>normalize(it.name)===normalize(name))){skipped++;continue;}const slot=data.items.findIndex(it=>!it.name&&!it.image);if(slot<0){skipped++;continue;}data.items[slot].name=name;changed++;}if(changed){if(!save()){data.items=before;const st=document.getElementById('settingsStatus');if(st)st.textContent='保存容量不足で追加を取り消しました。';return false;}updateCountDots();retrieveImagesForNewItems();const st=document.getElementById('settingsStatus');if(st){st.textContent=changed+'品を左から順に追加しました'+(skipped?'。'+skipped+'品は重複または6枠超過のため追加しませんでした。':'。');}return true;}const st=document.getElementById('settingsStatus');if(st)st.textContent=skipped?'重複品または6枠超過のため追加できませんでした。':'追加する品物を認識できませんでした。';return false;}
// 品物の変更機能は設けず、空き枠への追加登録のみ行う。
// 既存品を置き換える一括登録は行わず、追加処理に統一。
// In the settings screen, allow a plain multi-item list such as 「りんごとみかんとバナナ」.
const settingsVisible=document.getElementById('settings').classList.contains('active');const listLike=settingsVisible&&/(?:と|、|,|，|・)/.test(s)&&!/追加|変更|リセット/.test(s);if(listLike){const names=parseItemNames(s).slice(0,6);if(names.length>=2){const before=data.items.map(it=>({...it}));let changed=0,skipped=0;for(const name of names){if(data.items.some(it=>normalize(it.name)===normalize(name))){skipped++;continue;}const slot=data.items.findIndex(it=>!it.name&&!it.image);if(slot<0){skipped++;continue;}data.items[slot].name=name;changed++;}if(changed){if(!save()){data.items=before;return false;}updateCountDots();retrieveImagesForNewItems();const st=document.getElementById('settingsStatus');if(st){st.textContent=changed+'品を左から順に追加しました'+(skipped?'。'+skipped+'品は重複または6枠超過のため追加しませんでした。':'。');}return true;}}}
return false;}
function cueSimilarity(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a.includes(b)||b.includes(a))return 1;if(Math.min(a.length,b.length)<2)return 0;let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return 1-prev[b.length]/Math.max(a.length,b.length);}
function matchesSpecialCue(text){const t=normalize(text),cue=normalize(data.specialCue);if(cue.length>=4&&cueSimilarity(t,data.specialCue)>=0.62)return true;return /(?:さいご|最後).{0,8}(?:おも|思).{0,10}(?:こと|事)/.test(String(text||'').normalize('NFKC').replace(/[\s。、！？]/g,''));}function specialCuePosition(text){const t=normalize(text),cue=normalize(data.specialCue);let p=cue.length>=4?t.lastIndexOf(cue):-1;if(p>=0)return p;const m=t.match(/(?:さいご|最後).{0,8}(?:おも|思).{0,10}(?:こと|事)/g);if(m&&m.length){const phrase=m[m.length-1];return t.lastIndexOf(phrase);}return-1;}
function onCue(text){const t=normalize(text);if(!t)return;const hintEl=document.getElementById('hint');hintEl.style.display='block';hintEl.textContent='音声認識結果：'+String(text);const settingsStatus=document.getElementById('settingsStatus');if(settingsStatus)settingsStatus.textContent='音声認識結果：'+String(text);const settingsVisible=document.getElementById('settings').classList.contains('active');if(settingsVisible){if(handleItemCommand(text))return;const name=cleanItemName(String(text||'').normalize('NFKC').replace(/追加|登録|して|ください|下さい|お願いします|お願い|を|品物|アイテム/g,'').trim());if(name&&name.length<=30&&!/(保存|スタート|リセット|変更|判定用|特別写真)/.test(name)&&!data.items.some(it=>normalize(it.name)===normalize(name))){const slot=data.items.findIndex(it=>!it.name&&!it.image);if(slot>=0){data.items[slot].name=name;if(save()){updateCountDots();retrieveItemImage(name,slot);return;}data.items[slot]={name:'',image:''};}}const st=document.getElementById('settingsStatus');if(st)st.textContent='登録できませんでした。品物名だけを短く話すか、「品物名を追加」と話してください。';return;}if(isResetCue(text)){resetItems();return;}if(handleItemCommand(text))return;const spokenItem=String(text||'').normalize('NFKC').trim().match(/^(?:ここに|これが|品物は|品物が)?(.+?)(?:がいます|があります|を追加(?:します|して)?|追加します|追加して|です)$/);if(spokenItem){const candidate=cleanItemName(spokenItem[1]);if(candidate&&candidate.length<=30&&!/(保存|スタート|リセット|変更|判定用|特別写真)/.test(candidate)&&!data.items.some(it=>normalize(it.name)===normalize(candidate))){const slot=data.items.findIndex(it=>!it.name&&!it.image);if(slot>=0){data.items[slot].name=candidate;if(save()){updateCountDots();retrieveItemImage(candidate,slot);return;}data.items[slot]={name:'',image:''};}}}let idx=-1,bestScore=0,lastCuePosition=-1,specialPosition=specialCuePosition(text);data.cues.forEach((cue,i)=>{if(!(data.items[i]?.name||data.items[i]?.image))return;const nc=normalize(cue);const pos=nc.length>=3?t.lastIndexOf(nc):-1;if(pos>=0&&pos>=lastCuePosition){lastCuePosition=pos;idx=i;bestScore=1;return;}if(lastCuePosition<0){const score=cueSimilarity(t,cue);if(score>bestScore){bestScore=score;idx=i;}}});if(bestScore<0.60)idx=-1;if(specialPosition>=0&&(lastCuePosition<0||specialPosition>=lastCuePosition)){stopListen();pending={kind:'special'};prepareReveal();document.getElementById('hint').style.display='block';document.getElementById('hint').textContent='特別写真の言葉を認識しました。画面を伏せてから上向きに戻してください。ハートでも表示できます。';return;}if(specialPosition<0&&idx<0&&matchesSpecialCue(text)){stopListen();pending={kind:'special'};prepareReveal();document.getElementById('hint').style.display='block';document.getElementById('hint').textContent='特別写真の言葉を認識しました。画面を伏せてから上向きに戻してください。ハートでも表示できます。';return;}if(idx>=0){stopListen();pending={kind:'item',index:idx,cueIndex:idx};prepareReveal();document.getElementById('hint').style.display='block';document.getElementById('hint').textContent='判定用の言葉を認識しました（'+data.cues[idx]+'）。画面を伏せてから上向きに戻してください。ハートでも表示できます。';return;}document.getElementById('hint').style.display='block';document.getElementById('hint').textContent='音声認識：'+text+'（登録語に一致しません）';}function onPartialCue(text){if(document.getElementById('settings').classList.contains('active')||pending||revealed)return;const t=normalize(text);if(t.length<4)return;const h=document.getElementById('hint');h.style.display='block';h.textContent='音声を聞き取り中…';}
function prepareReveal(){revealed=false;specialOrientationActive=false;specialFaceDownSeen=false;document.getElementById('result').hidden=true;document.getElementById('result').innerHTML='';document.getElementById('heart').classList.add('ready');}
function playRevealSound(){try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;const ctx=new AudioCtx();if(ctx.state==='suspended')ctx.resume();const patterns=[[880,1175,1568],[660,990,1320],[784,1047,1397],[523,784,1047,1568],[698,1047,1397]];const notes=patterns[Math.floor(Math.random()*patterns.length)];notes.forEach((freq,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain(),start=ctx.currentTime+i*.095;osc.type=i%2?'triangle':'sine';osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.12,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+.19);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+.2);});setTimeout(()=>ctx.close().catch(()=>{}),900);}catch(e){/* 音声再生が使えなくても判定表示は続行 */}}
function reveal(){if(!pending||revealed)return;revealed=true;specialOrientationActive=pending.kind==='special';playRevealSound();stopListen();let result=document.getElementById('result');result.hidden=false;result.innerHTML='';document.getElementById('heart').classList.remove('ready');document.getElementById('hint').textContent='判定結果';if(pending.kind==='item'){document.getElementById('magic').classList.add('itemRevealMode');let item=data.items[pending.index]||{};const cueLabel=data.cues[pending.cueIndex]||'';if(item.image){let img=document.createElement('img');img.className='reveal itemFullscreen';img.src=item.image;img.alt=item.name||cueLabel||'選ばれた品物';result.appendChild(img);}let txt=document.createElement('div');txt.className='revealText'+(!item.image?' noImageText':'');txt.textContent=item.name||cueLabel||'品物';result.appendChild(txt);}else{document.getElementById('magic').classList.add('specialRevealMode');if(data.specialImage){let img=document.createElement('img');img.className='reveal specialFullscreen';img.src=data.specialImage;img.alt='特別写真';img.style.objectFit='contain';img.addEventListener('load',()=>{img.dataset.orientation=img.naturalWidth>=img.naturalHeight?'landscape':'portrait';});result.appendChild(img);}let txt=document.createElement('div');txt.className='revealText';txt.textContent=data.specialMessage||'特別写真';result.appendChild(txt);}result.onclick=nextRound;document.getElementById('heart').onclick=nextRound;document.getElementById('hint').textContent='結果をタップすると次の心読みへ';}
function nextRound(){pending=null;revealed=false;specialOrientationActive=false;specialFaceDownSeen=false;document.getElementById('magic').classList.remove('specialRevealMode','itemRevealMode');document.getElementById('result').hidden=true;document.getElementById('result').innerHTML='';document.getElementById('heart').onclick=heartAction;document.getElementById('heart').classList.add('ready');startListen();}
function heartAction(){if(pending&&!revealed){reveal();}}
function startListen(){if(window.MindMagicSpeech&&!listening){listening=true;window.MindMagicSpeech.start();}}
function stopListen(){if(speechRetryTimer){clearTimeout(speechRetryTimer);speechRetryTimer=null;}if(window.MindMagicSpeech)window.MindMagicSpeech.stop();listening=false;}
window.addEventListener('mindmagic-speech',e=>{let d=e.detail||{};if(d.type==='state'){listening=!!d.listening;return;}if(d.type==='partial'){if(!pending&&!revealed)onPartialCue(d.text);return;}if(d.type==='error'){listening=false;if(!pending&&!revealed&&(d.code===-1003||d.code===1||d.code===2||d.code===3||d.code===4||d.code===6||d.code===7||d.code===8)){if(speechRetryTimer)clearTimeout(speechRetryTimer);speechRetryTimer=setTimeout(()=>{speechRetryTimer=null;if(!pending&&!revealed)startListen();},900);}return;}if(d.type==='result'){listening=false;if(!pending&&!revealed){onCue(d.text);if(!pending&&!revealed)startListen();}}});document.getElementById('heart').onclick=heartAction;document.getElementById('secretTapZone').addEventListener('click',handleSecretTap);
window.addEventListener('deviceorientation',e=>{const el=document.getElementById('tiltStatus');if(el&&typeof e.beta==='number'&&typeof e.gamma==='number')el.textContent='傾き：前後 '+Math.round(e.beta)+'° ／ 左右 '+Math.round(e.gamma)+'°';});
// Optional device tilt: face-down gesture (screen orientation Z-axis near 180 degrees).
window.addEventListener('deviceorientation',e=>{if(typeof e.beta!=='number')return;const faceDown=Math.abs(e.beta)>145,faceUp=Math.abs(e.beta)<35;if(revealed&&faceDown){nextRound();return;}if(pending&&!revealed){if(faceDown&&!specialFaceDownSeen){specialFaceDownSeen=true;const h=document.getElementById('hint');h.textContent='伏せたことを確認しました。画面を上向きに戻してください。';return;}if(specialFaceDownSeen&&faceUp){reveal();return;}}});
load();renderSettings();updateCountDots();showMagic();startListen();
</script></body></html>
