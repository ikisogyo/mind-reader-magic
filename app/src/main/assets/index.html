function isResetCue(text){const t=String(text||'').normalize('NFKC').toLowerCase().replace(/[\s、。,.・!?！？]/g,'');if(t==='リセット')return true;if(!t.startsWith('リセット'))return false;const suffix=t.slice('リセット'.length);return ['をしてください','をして','をお願いします','をお願い','してください','して下さい','して','お願いします','お願い','します','する'].some(s=>suffix===s); }

async function retrieveItemImage(name,slot){const requestToken=++imageRequestTokens[slot];imageLoadingSlots[slot]=true;updateCountDots();const status=document.getElementById('settingsStatus');if(status)status.textContent=(slot+1)+'番の画像を検索中：'+name;try{const raw=String(name||'').trim(),lower=raw.toLowerCase();let variants=[raw+' single object isolated photo',raw+' product photo plain background',raw];if(/キティ|hello.?kitty/i.test(raw))variants=['Hello Kitty plush toy single isolated','Hello Kitty stuffed toy close up','Hello Kitty doll single object','キティちゃん ぬいぐるみ 単体','Hello Kitty plush'];else if(/アンパンマン/.test(raw))variants=['Anpanman plush toy single isolated','Anpanman character plush close up','アンパンマン ぬいぐるみ 単体','Anpanman plush toy'];else if(/ドラえもん/.test(raw))variants=['Doraemon plush toy single isolated','Doraemon character plush close up','ドラえもん ぬいぐるみ 単体','Doraemon plush toy'];else if(/つめきり|爪切り/.test(raw))variants=['nail clipper close up','nail clippers product photo','爪切り'];else if(/グラス|コップ/.test(raw))variants=['drinking glass transparent','glass cup on table','コップ グラス'];else if(/ぬいぐるみ/.test(raw))variants=[raw+' stuffed toy',raw+' plush toy',raw];else if(/はさみ|ハサミ/.test(raw))variants=['scissors household object','small scissors'];else if(/時計/.test(raw))variants=['wristwatch product photo','clock'];else if(/財布/.test(raw))variants=['wallet leather product photo','財布'];else if(/りんご|みかん|バナナ|果物/.test(raw))variants=[raw+' fruit photo',raw+' on white background',raw];let pages=[];for(const variant of [...new Set(variants)]){const q=encodeURIComponent(variant);const api='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch='+q+'&gsrnamespace=6&gsrlimit=15&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=700';const response=await fetch(api);if(!response.ok)continue;const json=await response.json();pages.push(...Object.values(json.query?.pages||{}));}const scored=pages.map(p=>{const title=String(p.title||'').toLowerCase(),info=p.imageinfo?.[0]||{};let score=0;const terms=raw.normalize('NFKC').toLowerCase().split(/[\\s　]+/).filter(x=>x.length>1);terms.forEach(term=>{if(title.includes(term))score+=3;});if(/kitty|キティ/.test(lower)&&/hello.?kitty|kitty/.test(title))score+=18;if(/キティ|hello.?kitty/i.test(raw)&&/plush|stuffed|ぬいぐるみ/.test(title))score+=10;if(/アンパンマン/.test(raw)&&/anpanman/.test(title))score+=18;if(/ドラえもん/.test(raw)&&/doraemon/.test(title))score+=18;if(/ドラえもん/.test(raw)&&/plush|stuffed|ぬいぐるみ/.test(title))score+=10;if(/爪切り|つめきり/.test(raw)&&/nail.?clipper/.test(title))score+=15;if(/グラス|コップ/.test(raw)&&/glass|cup/.test(title))score+=12;if(/logo|poster|diagram|screenshot|icon|symbol|map|chart|drawing|vector|svg/.test(title))score-=15;if(/group|groups|collection|lineup|set of|multiple|many|collage|montage|family|scene|background|crowd|store|museum|exhibit|壁紙|集合|複数|背景/.test(title))score-=24;if(/(^|[^a-z])(thumb|thumbnail|crop|cropped|montage|collage|sheet)([^a-z]|$)/.test(title))score-=8;if(info.mime&&info.mime!=='image/jpeg'&&info.mime!=='image/png'&&info.mime!=='image/webp')score-=5;if((info.width||0)<180||(info.height||0)<140)score-=5;return {p,score};}).sort((a,b)=>b.score-a.score);const candidates=scored.map(x=>x.p.imageinfo?.[0]?.thumburl||x.p.imageinfo?.[0]?.url).filter(Boolean);for(const url of [...new Set(candidates)]){const ok=await new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img.naturalWidth>=120&&img.naturalHeight>=100);img.onerror=()=>resolve(false);img.src=url;});if(!ok)continue;if(requestToken!==imageRequestTokens[slot]||!data.items[slot]||normalize(data.items[slot].name)!==normalize(name))return;data.items[slot].image=url;if(!save()){data.items[slot].image='';continue;}imageLoadingSlots[slot]=false;const thumb=document.getElementById('cueThumb'+slot);if(thumb)thumb.src=url;updateCountDots();if(status)status.textContent=(slot+1)+'番「'+name+'」の画像を取得しました。';return;}if(requestToken===imageRequestTokens[slot]){imageLoadingSlots[slot]=false;if(status)status.tex function handleItemCommand(text){const s=String(text||'').normalize('NFKC').trim();

const change=s.match(/^(.+?)(?:を|から)(.+?)(?:に|へ)(?:変更|変えて|変換|して|してください|して下さい|お願いします)?$/);
if(change){const from=change[1].trim(),to=cleanItemName(change[2]);let idx=/^[1-6](?:番)?$/.test(from)?parseInt(from,10)-1:data.items.findIndex(it=>normalize(it.name)===normalize(from));if(idx>=0&&to){const before={...data.items[idx]};data.items[idx].name=to;data.items[idx].image='';if(save()){updateCountDots();retrieveItemImage(to,idx);return true;}data.items[idx]=before;}return false;}
if(/(?:ここに|品物は|があります|がある)/.test(s)&&!/追加/.test(s)){const names=parseItemNames(s).slice(0,6);if(!names.length)return false;const before=data.items;data.items=Array.from({length:6},(_,i)=>({name:names[i]||'',image:''}));if(save()){updateCountDots();retrieveImagesForNewItems();return true;}data.items=before;}
// In the settings screen, allow a plain multi-item list such as 「りんごとみかんとバナナ」.
const settingsVisible=document.getElementById('settings').classList.contains('active');const listLike=settingsVisible&&/(?:と|、|,|，|・)/.test(s)&&!/追加|変更|リセット/.test(s);if(listLike){const names=parseItemNames(s).slice(0,6);if(names.length>=2){const before=data.items.map(it=>({...it}));let changed=0,skipped=0;for(const name of names){if(data.items.some(it=>normalize(it.name)===normalize(name))){skipped++;continue;}const slot=data.items.findIndex(it=>!it.name&&!it.image);if(slot<0){skipped++;continue;}data.items[slot].name=name;changed++;}if(changed){if(!save()){data.items=before;return false;}updateCountDots();retrieveImagesForNewItems();const st=document.getElementById('settingsStatus');if(st)st.textContent=changed+'品を左から順に追加しました'+(skipped?'。'+skipped+'品は重複または6枠超過のため追加しませんでした。':'。');return true;}}}
return false;}
function cueSimilarity(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a.includes(b)||b.includes(a))return 1;if(Math.min(a.length,b.length)<2)return 0;let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return 1-prev[b.length]/Math.max(a.length,b.length);}
function matchesSpecialCue(text){const t=normalize(text),cue=normalize(data.specialCue);if(cue.length>=4&&cueSimilarity(t,data.specialCue)>=0.62)return true;return /(?:さいご|最後).{0,8}(?:おも|思).{0,10}(?:こと|事)/.test(String(text||'').normalize('NFKC').replace(/[\s。、！？]/g,''));}function specialCuePosition(text){const t=normalize(text),cue=normalize(data.specialCue);let p=cue.length>=4?t.lastIndexOf(cue):-1;if(p>=0)return p;const m=t.match(/(?:さいご|最後).{0,8}(?:おも|思).{0,10}(?:こと|事)/g);if(m&&m.length){const phrase=m[m.length-1];return t.lastIndexOf(phrase);}return-1;}
function onCue(text){const t=normalize(text);if(!t)return;const settingsVisible=document.getElementById('settings').classList.contains('active');if(settingsVisible){if(handleItemCommand(text))return;const name=cleanItemName(String(text||'').normalize('NFKC').replace(/追加|登録|して|ください|下さい|お願いします|お願い|を|品物|アイテム/g,'').trim());if(name&&name.length<=30&&!/(保存|スタート|リセット|変更|判定用|特別写真)/.test(name)&&!data.items.some(it=>normalize(it.name)===normalize(name))){const slot=data.items.findIndex(it=>!it.name&&!it.image);if(slot>=0){data.items[slot].name=name;if(save()){updateCountDots();retrieveItemImage(name,slot);const st=document.getElementById('settingsStatus');if(st)st.textContent='音声で「'+name+'」を登録しました。画像を検索しています。';return;}data.items[slot]={name:'',image:''};}}const st=document.getElementById('settingsStatus');if(st)st.textContent='登録できませんでした。品物名だけを短く話すか、「品物名を追加」と話してください。';return;}if(isResetCue(text)){resetItems();return;}if(handleItemCommand(text))return;const spokenItem=String(text||'').normalize('NFKC').trim().match(/^(?:ここに|これが|品物は|品物が)?(.+?)(?:がいます|があります|を追加(?:します|して)?|追加します|追加して|です)$/);if(spokenItem){const candidate=cleanItemName(spokenItem[1]);if(candidate&&candidate.length<=30&&!/(保存|スタート|リセット|変更|判定用|特別写真)/.test(candidate)){const slot=data.items.findIndex(it=>!it.name&&!it.image);if(slot>=0){data.items[slot].name=candidate;if(save()){updateCountDots();retrieveItemImage(candidate,slot);const st=document.getElementById('settingsStatus');if(st)st.textContent='音声で「'+candidate+'」を追加しました。画像を検索しています。';return;}data.items[slot]={name:'',image:''};}}}let idx=-1,bestScore=0,lastCuePosition=-1,specialPosition=specialCuePosition(text);data.cues.forEach((cue,i)=>{if(!(data.items[i]?.name||data.items[i]?.image))return;const nc=normalize(cue);const pos=nc.length>=3?t.lastIndexOf(nc):-1;if(pos>=0&&pos>=lastCuePosition){lastCuePosition=pos;idx=i;bestScore=1;return;}if(lastCuePosition<0){const score=cueSimilarity(t,cue);if(score>bestScore){bestScore=score;idx=i;}}});if(bestScore<0.60)idx=-1;if(specialPosition>=0&&(lastCuePosition<0||specialPosition>=lastCuePosition)){stopListen();pending={kind:'special'};prepareReveal();document.getElementById('hint').style.display='block';document.getElementById('hint').textContent='特別写真の言葉を認識しました。';return;}if(specialPosition<0&&idx<0&&matchesSpecialCue(text)){stopListen();pending={kind:'special'};prepareReveal();document.getElementById('hint').style.display='block';document.getElementById('hint').textContent='特別写真の言葉を認識しました。';return;}if(idx>=0){stopListen();pending={kind:'item',index:idx,cueIndex:idx};prepareReveal();document.getElementById('hint').style.display='block';document.getElementById('hint').textContent='判定用の言葉を認識しました（'+data.cues[idx]+'）。ハートを押してください。';return;}document.getElementById('hint').style.display='block';document.getElementById('hint').textContent='音声認識：'+text+'（登録語に一致しません）';}function onPartialCue(text){if(document.getElementById('settings').classList.contains('active')||pending||revealed)return;const t=normalize(text);if(t.length<4)return;const h=document.getElementById('hint');h.style.display='block';h.textContent='音声を聞き取り中…';}
function prepareReveal(){revealed=false;specialOrientationActive=false;document.getElementById('result').hidden=true;document.getElementById('result').innerHTML='';document.getElementById('heart').classList.add('ready');}
function playRevealSound(){try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;const ctx=new AudioCtx();if(ctx.state==='suspended')ctx.resume();const patterns=[[880,1175,1568],[660,990,1320],[784,1047,1397],[523,784,1047,1568],[698,1047,1397]];const notes=patterns[Math.floor(Math.random()*patterns.length)];notes.forEach((freq,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain(),start=ctx.currentTime+i*.095;osc.type=i%2?'triangle':'sine';osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.12,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+.19);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+.2);});setTimeout(()=>ctx.close().catch(()=>{}),900);}catch(e){/* 音声再生が使えなくても判定表示は続行 */}}
function reveal(){if(!pending||revealed)return;revealed=true;specialOrientationActive=pending.kind==='special';playRevealSound();stopListen();let result=document.getElementById('result');result.hidden=false;result.innerHTML='';document.getElementById('heart').classList.remove('ready');document.getElementById('hint').textContent='判定結果';if(pending.kind==='item'){let item=data.items[pending.index]||{};const cueLabel=data.cues[pending.cueIndex]||'';if(item.image){let img=document.createElement('img');img.className='reveal';img.src=item.image;img.alt=item.name||cueLabel||'選ばれた品物';result.appendChild(img);}let txt=document.createElement('div');txt.className='revealText';txt.textContent=item.name||cueLabel||'品物';result.appendChild(txt);}else{if(data.specialImage){let img=document.createElement('img');img.className='reveal';img.src=data.specialImage;img.alt='特別写真';result.appendChild(img);}let txt=document.createElement('div');txt.className='revealText';txt.textContent=data.specialMessage||'特別写真';result.appendChild(txt);}result.onclick=nextRound;document.getElementById('heart').onclick=nextRound;document.getElementById('hint').textContent='結果をタップすると次の心読みへ';}
function nextRound(){pending=null;revealed=false;specialOrientationActive=false;document.getElementById('result').hidden=true;document.getElementById('result').innerHTML='';document.getElementById('heart').onclick=heartAction;document.getElementById('heart').classList.add('ready');startListen();}
function heartAction(){if(pending&&!revealed)reveal();}
function startListen(){if(window.MindMagicSpeech&&!listening){listening=true;window.MindMagicSpeech.start();}}
function stopListen(){if(speechRetryTimer){clearTimeout(speechRetryTimer);speechRetryTimer=null;}if(window.MindMagicSpeech)window.MindMagicSpeech.stop();listening=false;}
window.addEventListener('mindmagic-cue-text',e=>onCue(e.detail?.text));window.addEventListener('mindmagic-speech',e=>{let d=e.detail||{};if(d.type==='state'){listening=!!d.listening;return;}if(d.type==='partial'){if(!pending&&!revealed)onPartialCue(d.text);return;}if(d.type==='error'){listening=false;if(!pending&&!revealed&&(d.code===-1003||d.code===1||d.code===2||d.code===3||d.code===4||d.code===6||d.code===7||d.code===8)){if(speechRetryTimer)clearTimeout(speechRetryTimer);speechRetryTimer=setTimeout(()=>{speechRetryTimer=null;if(!pending&&!revealed)startListen();},900);}return;}if(d.type==='result'){listening=false;if(!pending&&!revealed){onCue(d.text);if(!pending&&!revealed)startListen();}}});document.getElementById('heart').onclick=heartAction;document.getElementById('secretTapZone').addEventListener('click',handleSecretTap);
window.addEventListener('deviceorientation',e=>{const el=document.getElementById('tiltStatus');if(el&&typeof e.beta==='number'&&typeof e.gamma==='number')el.textContent='傾き：前後 '+Math.round(e.beta)+'° ／ 左右 '+Math.round(e.gamma)+'°';});
// Optional device tilt: face-down gesture (screen orientation Z-axis near 180 degrees).
window.addEventListener('deviceorientation',e=>{if(typeof e.beta!=='number')return;const faceDown=Math.abs(e.beta)>145,faceUp=Math.abs(e.beta)<35;if(pending&&!revealed&&pending.kind==='special'&&faceDown){reveal();return;}if(specialOrientationActive&&revealed&&faceUp){nextRound();}});
load();renderSettings();updateCountDots();updateNetworkStatus();showMagic();startListen();
</script></body></html>
