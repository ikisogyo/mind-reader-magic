name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        # Keep the pipeline's exit status from sdkmanager (the last command).
        # pipefail can turn the expected SIGPIPE from `yes` into a false failure.
        run: |
          set +e
          yes | sdkmanager --licenses
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          exit "$sdkmanager_status"
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed
      - name: Run source preflight
        run: python3 build_preflight.py
      - name: Build debug APK first (capture diagnostics)
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build-debug.log
      - name: Verify APK output and create checksum
        id: verify-apk
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: Run JavaScript regression tests (after APK build)
        run: |
          set -e
          for test in tests/*.cjs; do
            echo "== $test =="
            node "$test"
          done
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mindmagic-build-diagnostics
          path: |
            build-debug.log
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload APK and checksum (even if later tests fail)
        if: always() && steps.verify-apk.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mindmagic-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
